[project]
name = "avito-recsys"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pyarrow",
    "numpy",
    "scipy",
    "pandas",
    "beartype",
    "implicit>=0.7",
    "catboost>=1.2",
    "duckdb>=1.5.4",
]

[dependency-groups]
dev = [
    "ruff",
    "ipykernel",
    "matplotlib",
    "nbstripout",
    "loguru>=0.7.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E, F - база, I - сортировка импортов, UP - современный синтаксис, PT - pytest
select = ["E", "F", "I", "UP", "PT"]

[tool.ruff.lint.per-file-ignores]
# стенд экспериментов и плотный финальный ноутбук (≤200 строк): длинные строки, `;`, import * — осознанно
"exp/*" = ["E401", "E402", "E501", "E701", "E702", "E731", "F403", "F405", "F841", "I001", "PT018"]
